<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Draw & Guess</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #eef3f8;
        color: #172b45;
        font-family: system-ui, sans-serif;
    }

    main {
        width: 100%;
        max-width: none;
        min-height: 100dvh;
        margin: 0;
        padding: 24px 32px;
        display: flex;
        flex-direction: column;
    }

    h1 {
        margin: 0;
        font-size: clamp(32px, 3vw, 44px);
        line-height: 1.2;
    }

    .intro {
        margin: 10px 0 0;
        color: #52647b;
        font-size: 18px;
        line-height: 1.5;
    }

    .categories {
        margin: 16px 0 24px;
        font-size: 18px;
        font-weight: 600;
        text-transform: capitalize;
    }

    .layout {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
        gap: 24px;
        align-items: stretch;
    }

    .card {
        min-width: 0;
        background: white;
        border: 1px solid #dce4ed;
        border-radius: 20px;
        padding: 24px;
        display: flex;
        flex-direction: column;
    }

    canvas {
        display: block;
        width: min(100%, clamp(320px, calc(100dvh - 300px), 1000px));
        max-width: none;
        height: auto;
        aspect-ratio: 1;
        margin: auto;
        flex-shrink: 0;
        border: 2px solid #d5dfeb;
        border-radius: 14px;
        touch-action: none;
        cursor: crosshair;
    }

    .buttons {
        display: flex;
        gap: 16px;
        margin-top: 20px;
    }

    button {
        flex: 1;
        padding: 15px;
        border: 0;
        border-radius: 12px;
        font: inherit;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
    }

    #guess {
        background: #2463dc;
        color: white;
    }

    #guess:hover {
        background: #194fba;
    }

    #clear {
        background: #eaf0f7;
        color: #172b45;
    }

    #clear:hover {
        background: #dce6f2;
    }

    button:disabled {
        opacity: .55;
        cursor: wait;
    }

    h2 {
        margin: 0 0 16px;
        font-size: clamp(24px, 2vw, 32px);
    }

    #message {
        min-height: 28px;
        margin: 0 0 16px;
        font-size: 18px;
        line-height: 1.5;
    }

    ol {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        gap: 20px;
        margin: 0 0 24px;
        padding-left: 28px;
    }

    ol:empty {
        display: none;
    }

    li {
        padding: 12px 0;
        font-size: 20px;
    }

    .prediction {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
    }

    .label {
        text-transform: capitalize;
        font-weight: 600;
    }

    progress {
        display: block;
        width: 100%;
        height: 18px;
        accent-color: #2463dc;
    }

    .note {
        margin: auto 0 0;
        padding-top: 16px;
        color: #52647b;
        font-size: 15px;
        line-height: 1.6;
    }

    @media (max-width: 760px) {
        main {
            padding: 20px 16px;
        }

        .layout {
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .card {
            padding: 20px;
        }

        canvas {
            width: min(100%, 560px);
        }

        ol:not(:empty) {
            min-height: 280px;
        }
    }
</style>
</head>
<body>
<main>
    <h1>Draw & Guess</h1>
    <p class="intro">
        Draw one of the five objects below, then let the model guess.
    </p>
    <p class="categories">{{ class_names | join(" · ") }}</p>

    <div class="layout">
        <section class="card" aria-label="Drawing area">
            <canvas id="canvas" width="280" height="280"
                    aria-label="Draw your object here"></canvas>
            <div class="buttons">
                <button id="clear" type="button">Clear</button>
                <button id="guess" type="button">Guess</button>
            </div>
        </section>

        <section class="card">
            <h2>Top 3 predictions</h2>
            <p id="message" role="status" aria-live="polite">
                Your predictions will appear here.
            </p>
            <ol id="predictions"></ol>
            <p class="note">
                Scores show the model's confidence, not a guarantee.
                The model chooses only from the five listed categories.
            </p>
        </section>
    </div>
</main>

<script>
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");
    const BRUSH_SIZE = 6;

const brushCursor = `
<svg xmlns="http://www.w3.org/2000/svg"
     width="32" height="32" viewBox="0 0 32 32">
    <g fill="#111" stroke="white" stroke-width="1">
        <path d="M12 18 L24 4
                 C26 2 29 2 30 4
                 C31 6 30 8 28 10
                 L16 22 Z"/>
        <path d="M11 18
                 C5 18 7 25 2 28
                 C8 30 15 27 15 22 Z"/>
    </g>
</svg>`;

canvas.style.cursor =
    `url("data:image/svg+xml,${encodeURIComponent(brushCursor)}") 2 28, crosshair`;
    const guessButton = document.getElementById("guess");
    const clearButton = document.getElementById("clear");
    const message = document.getElementById("message");
    const predictions = document.getElementById("predictions");

    let drawing = false;
    let hasDrawing = false;
    let busy = false;
    let lastPoint = null;

    function clearCanvas() {
        context.fillStyle = "white";
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawing = false;
        hasDrawing = false;
        predictions.replaceChildren();
        message.textContent = "Your predictions will appear here.";
    }

    function getPoint(event) {
        const bounds = canvas.getBoundingClientRect();
        return {
            x: (event.clientX - bounds.left) * canvas.width / bounds.width,
            y: (event.clientY - bounds.top) * canvas.height / bounds.height
        };
    }

    canvas.addEventListener("pointerdown", event => {
        if (busy || (event.pointerType === "mouse" && event.button !== 0)) {
            return;
        }

        canvas.setPointerCapture(event.pointerId);
        lastPoint = getPoint(event);
        drawing = true;
        hasDrawing = true;

        predictions.replaceChildren();
        message.textContent = "";

        context.fillStyle = "#111";
        context.beginPath();
        context.arc(
    lastPoint.x,
    lastPoint.y,
    BRUSH_SIZE / 2,
    0,
    Math.PI * 2
);
        context.fill();
    });

    canvas.addEventListener("pointermove", event => {
        if (!drawing || busy) return;

        const point = getPoint(event);
        context.strokeStyle = "#111";
        context.lineWidth = BRUSH_SIZE;
        context.lineCap = "round";
        context.lineJoin = "round";

        context.beginPath();
        context.moveTo(lastPoint.x, lastPoint.y);
        context.lineTo(point.x, point.y);
        context.stroke();

        lastPoint = point;
    });

    for (const eventName of ["pointerup", "pointercancel", "lostpointercapture"]) {
        canvas.addEventListener(eventName, () => {
            drawing = false;
        });
    }

    clearButton.addEventListener("click", clearCanvas);

    guessButton.addEventListener("click", async () => {
        if (!hasDrawing) {
            message.textContent = "Please draw something first.";
            return;
        }

        busy = true;
        drawing = false;
        guessButton.disabled = true;
        clearButton.disabled = true;
        predictions.replaceChildren();
        message.textContent = "Thinking...";

        try {
            const response = await fetch("/predict", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({image: canvas.toDataURL("image/png")})
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Prediction failed.");
            }

            for (const item of data.predictions) {
                const row = document.createElement("li");
                const heading = document.createElement("div");
                heading.className = "prediction";

                const label = document.createElement("span");
                label.className = "label";
                label.textContent = item.label;

                const score = document.createElement("span");
                score.textContent = `${(item.confidence * 100).toFixed(1)}%`;

                const bar = document.createElement("progress");
                bar.max = 1;
                bar.value = item.confidence;
                bar.setAttribute("aria-label", `${item.label} confidence`);

                heading.append(label, score);
                row.append(heading, bar);
                predictions.append(row);
            }

            message.textContent = "Here are my guesses:";
        } catch (error) {
            message.textContent = error.message;
        } finally {
            busy = false;
            guessButton.disabled = false;
            clearButton.disabled = false;
        }
    });

    clearCanvas();
</script>
</body>
</html>
